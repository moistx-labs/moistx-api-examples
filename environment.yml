name: moistx-api-examples
channels:
  - conda-forge
dependencies:
  - python=3.11

  # Core
  - requests>=2.31
  - pandas>=2.0
  - numpy>=1.24
  - python-dotenv>=1.0

  # Geospatial (buffer geometry, GeoTIFF I/O, WKT parsing)
  - shapely>=2.0
  - rasterio>=1.3
  - geopandas>=0.14

  # Clustering (reference-pixel detection in 02_irrigation_detection.ipynb)
  - scikit-learn>=1.3

  # Visualization
  - plotly>=5.18
  - folium>=0.16
  - branca>=0.7

  # Notebook runtime
  - jupyterlab>=4.0
  - ipykernel>=6.29
  - ipywidgets>=8.0
